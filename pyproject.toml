[project]
name = "supplyzero-backend"
version = "0.1.0"
description = "Dynamic cold-chain expiry and redistribution engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0", "sqlalchemy[asyncio]>=2.0,<3.0", "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0", "redis>=5.0,<6.0", "httpx>=0.27,<1.0",
  "aiomqtt>=2.3,<3.0", "structlog>=24.4,<26.0", "orjson>=3.10,<4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
